    label: "<<extend>>"
    condition: "[payment required]"
    labelBox: {x: 12.7, y: 5.95, width: 2.7, height: 0.45}
    conditionBox: {x: 12.7, y: 6.95, width: 3.6, height: 0.45}

  - id: EXT-09-08
    connectorType: extend
    source: UC-09
    target: UC-08
    sourceSide: TOP
    targetSide: BOTTOM
    sourcePortFraction: 0.5
