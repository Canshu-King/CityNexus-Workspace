metadata:
  name: CityNexus C4 Extend Fallback Calibration
  version: 0.1.0
  units: cm
  intent: >
    Validate native Microsoft UML Extend semantics with hidden semantic stroke,
    explicit top/bottom side-port glue, deterministic dashed presentation
    routing, one terminal open arrow, and explicit <<extend>> / condition labels.

page:
  name: C4E_Extend
  widthCm: 33.87
  heightCm: 19.05

nodes:
  - id: UC-06
    kind: usecase
    x: 11.1
    y: 8.2
    width: 4.8
    height: 1.35
    text: "UC-06\nBook & Order Services"
    styleRef: useCaseDefault
  - id: UC-07
    kind: usecase
    x: 17.2
    y: 8.2
    width: 4.8
    height: 1.35
    text: "UC-07\nMake Secure Payment"
