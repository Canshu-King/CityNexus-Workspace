openapi: 3.1.0
info:
  title: CityNexus MVP API
  version: 0.1.0
  description: >-
    Coursework MVP contract. Deterministic feasibility is authoritative; AI is optional.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /demo/reset:
    post:
      operationId: resetDemo
      responses:
        '200':
          description: Demo database reset and seeded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: reset}
  /travelers:
    post:
      operationId: createTraveler
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TravelerCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Traveler'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /travelers/{traveler_id}:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    get:
      operationId: getTraveler
      responses:
        '200':
          description: Traveler
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Traveler'}
        '404': {$ref: '#/components/responses/NotFound'}
  /travelers/{traveler_id}/preferences:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    get:
      operationId: listPreferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Preference'}
    put:
      operationId: replacePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '#/components/schemas/PreferenceInput'}
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Preference'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys:
    post:
      operationId: createJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourney
      responses:
        '200':
          description: Journey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyPatch'}
      responses:
        '200':
          description: Updated journey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/constraints:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listConstraints
      responses:
        '200':
          description: Constraints
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Constraint'}
    post:
      operationId: addConstraint
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConstraintInput'}
      responses:
        '201':
          description: Constraint created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Constraint'}
  /journeys/{journey_id}/constraints/{constraint_id}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: constraint_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: deleteConstraint
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
  /places:
    get:
      operationId: searchPlaces
      parameters:
        - name: city_code
          in: query
          required: true
          schema: {type: string}
        - name: category
          in: query
          schema: {type: string}
        - name: q
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Place catalog
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Place'}
  /city-services:
    get:
      operationId: searchCityServices
      parameters:
        - name: city_code
          in: query
          required: true
          schema: {type: string}
        - name: service_type
          in: query
          schema: {type: string}
      responses:
        '200':
          description: City services
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CityService'}
  /city-services/{service_id}/booking-slots:
    parameters:
      - name: service_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getBookingSlots
      parameters:
        - name: start_at
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end_at
          in: query
          required: true
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Normalised provider booking slots with provenance
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BookingSlot'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/plans/generate:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: generatePlans
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                planning_mode: {$ref: '#/components/schemas/PlanningMode'}
                candidate_count: {type: integer, minimum: 1, maximum: 5, default: 3}
      responses:
        '201':
          description: Feasible candidate plans
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanVersion'}
        '422': {$ref: '#/components/responses/Infeasible'}
  /journeys/{journey_id}/plans:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listPlans
      responses:
        '200':
          description: Journey plan versions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanVersion'}
  /plans/{plan_version_id}:
    parameters:
      - {$ref: '#/components/parameters/PlanVersionId'}
    get:
      operationId: getPlan
      responses:
        '200':
          description: Plan with activities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/plans/{plan_version_id}/select:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/PlanVersionId'}
    post:
      operationId: selectPlan
      responses:
        '200':
          description: Selected plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Infeasible'}
  /journeys/{journey_id}/bookings:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookingCreate'}
      responses:
        '201':
          description: Simulated booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
  /bookings/{booking_id}/cancel:
    post:
      operationId: cancelBooking
      parameters:
        - name: booking_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Cancelled booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{booking_id}:
    parameters:
      - name: booking_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getBooking
      responses:
        '200':
          description: Current provider-normalised booking state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/orders:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreate'}
      responses:
        '201':
          description: Simulated order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
  /journeys/{journey_id}/transactions:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransactionCreate'}
      responses:
        '201':
          description: Simulated transaction
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '409': {$ref: '#/components/responses/Conflict'}
  /transactions/{transaction_id}:
    parameters:
      - name: transaction_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getTransaction
      responses:
        '200':
          description: Current provider-normalised payment state and traceable reference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '404': {$ref: '#/components/responses/NotFound'}
  /commitments/{commitment_id}:
    parameters:
      - name: commitment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getCommitment
      responses:
        '200':
          description: Commitment state and deterministic policy evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Commitment'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/start:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: startJourney
      responses:
        '200':
          description: Journey started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyTwin'}
        '409': {$ref: '#/components/responses/Conflict'}
  /journeys/{journey_id}/activities/{activity_id}/complete:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: activity_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: completeActivity
      responses:
        '200':
          description: Updated JourneyTwin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyTwin'}
        '409': {$ref: '#/components/responses/Conflict'}
  /journeys/{journey_id}/twin:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourneyTwin
      responses:
        '200':
          description: JourneyTwin projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyTwin'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/history:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourneyHistory
      responses:
        '200':
          description: Timeline of audit-worthy journey events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/HistoryItem'}
  /journeys/{journey_id}/events:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listEvents
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Event'}
    post:
      operationId: injectOrRecordEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventCreate'}
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
  /journeys/{journey_id}/replans:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listReplans
      responses:
        '200':
          description: Replan proposals
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ReplanProposal'}
    post:
      operationId: generateReplan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger_event_id]
              properties:
                trigger_event_id: {type: string, format: uuid}
                candidate_count: {type: integer, minimum: 1, maximum: 5, default: 3}
      responses:
        '201':
          description: Best deterministic proposal and alternatives if retained
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplanProposal'}
        '422': {$ref: '#/components/responses/Infeasible'}
  /replans/{proposal_id}:
    parameters:
      - {$ref: '#/components/parameters/ProposalId'}
    get:
      operationId: getReplan
      responses:
        '200':
          description: Proposal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplanProposal'}
        '404': {$ref: '#/components/responses/NotFound'}
  /replans/{proposal_id}/accept:
    parameters:
      - {$ref: '#/components/parameters/ProposalId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: acceptReplan
      responses:
        '200':
          description: Proposal accepted and new plan activated atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplanAcceptance'}
        '409': {$ref: '#/components/responses/Conflict'}
  /replans/{proposal_id}/reject:
    parameters:
      - {$ref: '#/components/parameters/ProposalId'}
    post:
      operationId: rejectReplan
      responses:
        '200':
          description: Proposal rejected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplanProposal'}
  /journeys/{journey_id}/copilot/messages:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: copilotMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 4000}
      responses:
        '200':
          description: AI or deterministic fallback answer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CopilotResponse'}
components:
  parameters:
    TravelerId:
      name: traveler_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    JourneyId:
      name: journey_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanVersionId:
      name: plan_version_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Input validation error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Infeasible:
      description: No feasible result under hard constraints
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    PlanningMode:
      type: string
      enum: [balanced, budget, explore, strict_schedule]
    HealthResponse:
      type: object
      required: [status, database, ai]
      properties:
        status: {type: string, enum: [ok, degraded]}
        database: {type: string, enum: [ok, error]}
        ai: {type: string, enum: [available, unavailable, disabled]}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            trace_id: {type: string}
    TravelerCreate:
      type: object
      required: [display_name, timezone]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 120}
        email: {type: [string, 'null'], format: email}
        locale: {type: string, default: en-GB}
        timezone: {type: string}
    Traveler:
      allOf:
        - {$ref: '#/components/schemas/TravelerCreate'}
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    PreferenceInput:
      type: object
      required: [category, key, value, weight]
      properties:
        category: {type: string}
        key: {type: string}
        value: {}
        weight: {type: number, minimum: 0, maximum: 1}
    Preference:
      allOf:
        - {$ref: '#/components/schemas/PreferenceInput'}
        - type: object
          required: [id, traveler_id]
          properties:
            id: {type: string, format: uuid}
            traveler_id: {type: string, format: uuid}
    JourneyCreate:
      type: object
      required: [traveler_id, title, city_code, timezone, start_at, end_at, budget]
      properties:
        traveler_id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        city_code: {type: string}
        timezone: {type: string}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        budget: {$ref: '#/components/schemas/Money'}
        planning_mode: {$ref: '#/components/schemas/PlanningMode'}
    JourneyPatch:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        budget: {$ref: '#/components/schemas/Money'}
    Journey:
      type: object
      required: [id, traveler_id, title, city_code, timezone, start_at, end_at, budget, status]
      properties:
        id: {type: string, format: uuid}
        traveler_id: {type: string, format: uuid}
        title: {type: string}
        city_code: {type: string}
        timezone: {type: string}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        budget: {$ref: '#/components/schemas/Money'}
        planning_mode: {$ref: '#/components/schemas/PlanningMode'}
        status: {type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, CANCELLED]}
        active_plan_version_id: {type: [string, 'null'], format: uuid}
        current_activity_id: {type: [string, 'null'], format: uuid}
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: {type: integer, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3}
    ConstraintInput:
      type: object
      required: [kind, category, rule_code]
      properties:
        kind: {type: string, enum: [HARD, SOFT]}
        category: {type: string}
        rule_code: {type: string}
        params: {type: object, additionalProperties: true, default: {}}
        weight: {type: number, minimum: 0, default: 1}
    Constraint:
      allOf:
        - {$ref: '#/components/schemas/ConstraintInput'}
        - type: object
          required: [id, journey_id, active]
          properties:
            id: {type: string, format: uuid}
            journey_id: {type: string, format: uuid}
            active: {type: boolean}
    Place:
      type: object
      required: [id, name, category, location, city_code]
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string}
        city_code: {type: string}
        location: {$ref: '#/components/schemas/GeoPoint'}
        tags: {type: array, items: {type: string}}
    CityService:
      type: object
      required: [id, name, service_type, city_code]
      properties:
        id: {type: string}
        name: {type: string}
        service_type: {type: string}
        city_code: {type: string}
        place_id: {type: [string, 'null']}
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
    Activity:
      type: object
      required: [id, sequence_no, title, start_at, end_at, status, estimated_cost]
      properties:
        id: {type: string, format: uuid}
        sequence_no: {type: integer, minimum: 1}
        title: {type: string}
        activity_type: {type: string}
        place_id: {type: [string, 'null']}
        city_service_id: {type: [string, 'null']}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        travel_from_prev_min: {type: integer, minimum: 0}
        estimated_cost: {$ref: '#/components/schemas/Money'}
        status: {type: string, enum: [PLANNED, READY, ACTIVE, COMPLETED, SKIPPED, CANCELLED]}
        locked: {type: boolean}
    ScoreBreakdown:
      type: object
      required: [commitment_preservation, stability, time_reliability, preference_fit, mobility_fit, budget_fit, robustness, opportunity_value, total]
      properties:
        commitment_preservation: {type: number, minimum: 0, maximum: 1}
        stability: {type: number, minimum: 0, maximum: 1}
        time_reliability: {type: number, minimum: 0, maximum: 1}
        preference_fit: {type: number, minimum: 0, maximum: 1}
        mobility_fit: {type: number, minimum: 0, maximum: 1}
        budget_fit: {type: number, minimum: 0, maximum: 1}
        robustness: {type: number, minimum: 0, maximum: 1}
        opportunity_value: {type: number, minimum: 0, maximum: 1}
        total: {type: number, minimum: 0, maximum: 1}
    PlanVersion:
      type: object
      required: [id, journey_id, version_no, planning_mode, status, source, activities]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        version_no: {type: integer, minimum: 1}
        planning_mode: {$ref: '#/components/schemas/PlanningMode'}
        status: {type: string, enum: [CANDIDATE, SELECTED, ACTIVE, SUPERSEDED, REJECTED]}
        source: {type: string, enum: [INITIAL, REPLAN, MANUAL]}
        parent_plan_version_id: {type: [string, 'null'], format: uuid}
        total_cost: {$ref: '#/components/schemas/Money'}
        utility_score: {type: [number, 'null'], minimum: 0, maximum: 1}
        score_breakdown: {oneOf: [{$ref: '#/components/schemas/ScoreBreakdown'}, {type: 'null'}]}
        activities:
          type: array
          items: {$ref: '#/components/schemas/Activity'}
    BookingSlot:
      type: object
      required: [start_at, end_at, provider_key, provider_slot_ref]
      properties:
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        provider_key: {type: string}
        provider_slot_ref: {type: string}
    BookingCreate:
      type: object
      required: [activity_id]
      properties:
        activity_id: {type: string, format: uuid}
        provider_key: {type: string, default: mock-booking}
        failure_token: {type: [string, 'null'], enum: [FORCE_BOOKING_FAIL, null]}
        force_failure: {type: boolean, default: false}
    Booking:
      type: object
      required: [id, journey_id, activity_id, status, amount]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        activity_id: {type: string, format: uuid}
        commitment_id: {type: [string, 'null'], format: uuid}
        provider_key: {type: string}
        external_ref: {type: [string, 'null']}
        status: {type: string, enum: [DRAFT, PENDING, CONFIRMED, COMPLETED, CANCELLED, FAILED]}
        amount: {$ref: '#/components/schemas/Money'}
        cancellation_policy: {type: object, additionalProperties: true}
    OrderCreate:
      type: object
      required: [activity_id, items]
      properties:
        activity_id: {type: string, format: uuid}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: {type: string}
              quantity: {type: integer, minimum: 1}
        provider_key: {type: string, default: mock-booking}
    Order:
      type: object
      required: [id, journey_id, status, amount]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        activity_id: {type: [string, 'null'], format: uuid}
        commitment_id: {type: [string, 'null'], format: uuid}
        provider_key: {type: string}
        external_ref: {type: [string, 'null']}
        status: {type: string, enum: [DRAFT, PENDING, CONFIRMED, FULFILLED, CANCELLED, FAILED]}
        amount: {$ref: '#/components/schemas/Money'}
        items:
          type: array
          items:
            type: object
            required: [sku, quantity, unit_amount_minor, line_total_minor]
            properties:
              sku: {type: string}
              quantity: {type: integer, minimum: 1}
              unit_amount_minor: {type: integer, minimum: 0}
              line_total_minor: {type: integer, minimum: 0}
    TransactionCreate:
      type: object
      required: [transaction_type, amount]
      properties:
        booking_id: {type: [string, 'null'], format: uuid}
        order_id: {type: [string, 'null'], format: uuid}
        transaction_type: {type: string, enum: [AUTHORIZE, CAPTURE, REFUND, VOID]}
        amount: {$ref: '#/components/schemas/Money'}
        provider_key: {type: string, default: mock-payment}
        failure_token: {type: [string, 'null'], enum: [FORCE_PAYMENT_FAIL, null]}
        force_failure: {type: boolean, default: false}
    Transaction:
      type: object
      required: [id, journey_id, status, transaction_type, amount]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        status: {type: string, enum: [INITIATED, AUTHORIZED, SUCCEEDED, FAILED, REFUNDED, VOIDED]}
        transaction_type: {type: string, enum: [AUTHORIZE, CAPTURE, REFUND, VOID]}
        amount: {$ref: '#/components/schemas/Money'}
        external_ref: {type: [string, 'null']}
        booking_id: {type: [string, 'null'], format: uuid}
        order_id: {type: [string, 'null'], format: uuid}
        provider_key: {type: string}
    EventCreate:
      type: object
      required: [event_type, severity, occurred_at]
      properties:
        provider_key: {type: string, default: mock-context}
        event_type: {type: string, enum: [TRAFFIC_DELAY, CLOSURE, WEATHER, SCHEDULE_DELAY, SERVICE_UNAVAILABLE, USER_CHANGE, OTHER]}
        severity: {type: string, enum: [INFO, MINOR, MAJOR, CRITICAL]}
        affected_activity_id: {type: [string, 'null'], format: uuid}
        occurred_at: {type: string, format: date-time}
        payload: {type: object, additionalProperties: true, default: {}}
    Event:
      allOf:
        - {$ref: '#/components/schemas/EventCreate'}
        - type: object
          required: [id, journey_id, status, detected_at]
          properties:
            id: {type: string, format: uuid}
            journey_id: {type: string, format: uuid}
            status: {type: string, enum: [DETECTED, ACKNOWLEDGED, RESOLVED, IGNORED]}
            detected_at: {type: string, format: date-time}
    Commitment:
      type: object
      required: [id, journey_id, kind, level, status]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        activity_id: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [BOOKING, ORDER, PAYMENT, APPOINTMENT, OTHER]}
        level: {type: string, enum: [C0_Flexible, C1_Preferred, C2_Reserved, C3_Guaranteed, C4_Anchored]}
        status: {type: string, enum: [PROPOSED, ACTIVE, FULFILLED, CANCELLED, BREACHED]}
        monetary_value: {$ref: '#/components/schemas/Money'}
        external_ref: {type: [string, 'null']}
        policy: {type: object, additionalProperties: true}
    ReplanProposal:
      type: object
      required: [id, journey_id, base_plan_version_id, proposed_plan_version_id, status, hard_constraints_passed, locked_commitments_preserved, utility_score, score_breakdown, diff, explanation]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        trigger_event_id: {type: [string, 'null'], format: uuid}
        base_plan_version_id: {type: string, format: uuid}
        proposed_plan_version_id: {type: string, format: uuid}
        status: {type: string, enum: [GENERATED, PRESENTED, ACCEPTED, REJECTED, EXPIRED, INVALIDATED]}
        hard_constraints_passed: {type: boolean}
        locked_commitments_preserved: {type: boolean}
        utility_score: {type: number, minimum: 0, maximum: 1}
        score_breakdown: {$ref: '#/components/schemas/ScoreBreakdown'}
        diff: {type: object, additionalProperties: true}
        explanation:
          type: object
          required: [summary, reasons]
          properties:
            summary: {type: string}
            reasons: {type: array, items: {type: string}}
            source: {type: string, enum: [DETERMINISTIC, AI, HYBRID]}
    JourneyTwin:
      type: object
      required: [journey_id, projection_status, snapshot_at]
      properties:
        journey_id: {type: string, format: uuid}
        active_plan_version_id: {type: [string, 'null'], format: uuid}
        current_activity_id: {type: [string, 'null'], format: uuid}
        latest_event_id: {type: [string, 'null'], format: uuid}
        projection_status: {type: string, enum: [READY, STALE, DEGRADED]}
        snapshot_at: {type: string, format: date-time}
        upcoming_commitments:
          type: array
          items: {$ref: '#/components/schemas/Commitment'}
        context: {type: object, additionalProperties: true}
    ReplanAcceptance:
      type: object
      required: [journey, proposal, twin]
      properties:
        journey: {$ref: '#/components/schemas/Journey'}
        proposal: {$ref: '#/components/schemas/ReplanProposal'}
        twin: {$ref: '#/components/schemas/JourneyTwin'}
    HistoryItem:
      type: object
      required: [timestamp, type, summary]
      properties:
        timestamp: {type: string, format: date-time}
        type: {type: string}
        summary: {type: string}
        entity_id: {type: [string, 'null']}
    CopilotResponse:
      type: object
      required: [message, mode, verified_context_used]
      properties:
        message: {type: string}
        mode: {type: string, enum: [AI, FALLBACK]}
        verified_context_used: {type: boolean}
        recommendations:
          type: array
          items: {type: object, additionalProperties: true}
