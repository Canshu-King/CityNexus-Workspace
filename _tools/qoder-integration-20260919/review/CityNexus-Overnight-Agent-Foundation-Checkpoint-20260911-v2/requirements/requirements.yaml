  acceptanceCriteria:
  - id: FR-020-AC-01
    condition: Given a Place returned by search, when its detail view or API representation is opened
    expectedResult: Coordinates, address, category and current or known opening status are present.
    verificationMethod: functional_test
  useCases:
  - UC-05
  domainElements:
  - name: Place
    kind: entity
  dependsOn: []
  conflictsWith: []
