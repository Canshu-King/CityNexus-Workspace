- id: FR-019
  type: functional_requirement
  title: Ground Executable Places in Real Data
  statement: Candidate executable places shall originate from at least one real POI data provider.
  sources:
  - ARCH
  - GH-TS
  priority: M
  rationale: This capability implements the “ground executable places in real data” responsibility in the mapped
    traveler or system workflow.
  acceptanceCriteria:
  - id: FR-019-AC-01
    condition: Given an executable place candidate, when its provenance is inspected
    expectedResult: The Place contains a valid provider and providerPlaceId from a configured POI provider.
    verificationMethod: integration_test
  useCases:
  - UC-05
  domainElements:
  - name: Place
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: integration_test
  testCases: []
  status: proposed
- id: FR-020
  type: functional_requirement
  title: Show Place Details
  statement: Place details shall include coordinates, address, category and current or known opening status.
  sources:
  - UJ
  priority: M
  rationale: This capability implements the “show place details” responsibility in the mapped traveler or system
