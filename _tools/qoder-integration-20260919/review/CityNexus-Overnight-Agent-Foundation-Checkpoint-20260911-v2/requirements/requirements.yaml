business_goals:
- id: BG-001
  type: business_goal
  title: Maintain an Executable Journey
  statement: For a valid Journey affected by a disruptive event, CityNexus shall produce either an executable revised
    plan or an explicit no-feasible-plan result.
  sources:
  - UJ
  - DM
  - OPT
  priority: M
  rationale: This goal defines the product outcome “maintain an executable journey” and guides downstream capability
    and quality requirements.
  acceptanceCriteria:
  - id: BG-001-AC-01
    condition: Given a valid active Journey and a disruption fixture that makes its current plan infeasible, when
      recovery is requested
    expectedResult: The system returns at least one plan that passes applicable hard-constraint validation or records
      a no-feasible-plan result with a reason.
    verificationMethod: demonstration
  useCases:
  - UC-04
  - UC-08
  - UC-10
  domainElements:
  - name: Journey
    kind: entity
  - name: JourneyTwin
    kind: entity
  - name: ReplanProposal
    kind: entity
  - name: PlanVersion
    kind: entity
  - name: Constraint
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: demonstration
  testCases: []
  status: proposed
- id: BG-002
  type: business_goal
  title: Reduce Journey Tool Fragmentation
  statement: The Golden Journey scenario shall allow a traveler to plan, commit, execute and recover a city journey
    without manually switching among multiple independent tools to recompute the whole journey.
  sources:
  - UJ
  priority: M
  rationale: This goal defines the product outcome “reduce journey tool fragmentation” and guides downstream capability
    and quality requirements.
  acceptanceCriteria:
  - id: BG-002-AC-01
    condition: Given the defined Golden Journey scenario, when a traveler proceeds from journey creation through
      execution and disruption recovery
    expectedResult: The traveler completes the scenario in CityNexus without manually rebuilding the whole journey
      in an external planning tool.
    verificationMethod: demonstration
  useCases:
  - UC-02
  - UC-05
  - UC-06
  - UC-07
  - UC-08
  domainElements: []
  dependsOn: []
  conflictsWith: []
  verificationMethod: demonstration
  testCases: []
  status: proposed
- id: BG-003
  type: business_goal
  title: Recover from Real-World Disruption
  statement: CityNexus shall respond to real-world disruption including place closure, transit delay and weather
    change and determine whether replanning is required.
  sources:
  - UJ
  - OPT
  priority: M
  rationale: This goal defines the product outcome “recover from real-world disruption” and guides downstream capability
    and quality requirements.
  acceptanceCriteria:
  - id: BG-003-AC-01
    condition: Given separate valid fixtures for place closure, transit delay and weather change, when each event
      is processed
    expectedResult: The system updates journey context and produces an impact decision stating whether replanning
      is required.
    verificationMethod: system_test
  useCases:
  - UC-09
  - UC-10
  domainElements:
  - name: Event
    kind: entity
  - name: JourneyTwin
    kind: entity
  - name: ReplanProposal
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: system_test
  testCases: []
  status: proposed
- id: BG-004
  type: business_goal
  title: Protect High-Strength Commitments
  statement: Normal replanning shall not silently break high-strength C3 or C4 commitments.
  sources:
  - DM
  - OPT
  priority: M
  rationale: This goal defines the product outcome “protect high-strength commitments” and guides downstream capability
    and quality requirements.
  acceptanceCriteria:
  - id: BG-004-AC-01
    condition: Given an active Journey containing C3 and C4 commitments, when normal replanning is executed
    expectedResult: No C4 commitment is moved or removed, and any material C3 impact is disclosed for explicit traveler
      confirmation.
    verificationMethod: system_test
  useCases:
  - UC-03
  - UC-10
  domainElements:
  - name: Commitment
    kind: entity
  - name: Constraint
    kind: entity
  - name: ReplanProposal
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: system_test
  testCases: []
  status: proposed
- id: BG-005
  type: business_goal
  title: Deliver Context-Aware Personalisation
  statement: Recommendations shall consider the traveler's current location, available time, preferences, budget
    and next important commitment.
  sources:
  - UJ
  - AI
  - OPT
  priority: M
  rationale: This goal defines the product outcome “deliver context-aware personalisation” and guides downstream
    capability and quality requirements.
  acceptanceCriteria:
  - id: BG-005-AC-01
    condition: Given a Journey Twin containing location, time, budget, preferences and a next important commitment,
      when recommendations are requested
    expectedResult: The recommendation record and score evidence show that all five context dimensions were evaluated.
    verificationMethod: demonstration
  useCases:
  - UC-05
  - UC-08
  - UC-11
  domainElements:
  - name: JourneyTwin
    kind: entity
  - name: Preference
    kind: entity
  - name: Commitment
    kind: entity
  - name: Recommendation
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: demonstration
  testCases: []
  status: proposed
- id: BG-006
  type: business_goal
  title: Unify Actionable City Services
  statement: At least three categories of actionable city service shall be represented by a common CityService model.
  sources:
  - ARCH
  priority: S
  rationale: This goal defines the product outcome “unify actionable city services” and guides downstream capability
    and quality requirements.
  acceptanceCriteria:
  - id: BG-006-AC-01
    condition: Given representative attraction, dining and local-activity service records, when the domain model
      and fixtures are inspected
    expectedResult: All three are represented through CityService without requiring separate incompatible service
      models.
    verificationMethod: inspection
  useCases:
  - UC-05
  - UC-06
  domainElements:
  - name: Place
    kind: entity
  - name: CityService
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: inspection
  testCases: []
  status: proposed
- id: BG-007
  type: business_goal
  title: Explain Intelligent Decisions
  statement: Major recommendations and replanning decisions shall provide an understandable reason and a reviewable
    summary of changes.
  sources:
  - AI
  - DM
  priority: M
  rationale: This goal defines the product outcome “explain intelligent decisions” and guides downstream capability
    and quality requirements.
  acceptanceCriteria:
  - id: BG-007-AC-01
    condition: Given a major recommendation and a major replanning proposal, when each is presented to the traveler
    expectedResult: Each presentation includes a human-readable rationale grounded in system data, and the replanning
      proposal includes a reviewable change summary.
    verificationMethod: demonstration
  useCases:
  - UC-05
  - UC-10
  - UC-11
  domainElements:
  - name: Recommendation
    kind: entity
  - name: ReplanProposal
    kind: entity
  - name: CandidatePlan
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: demonstration
  testCases: []
  status: proposed
- id: BG-008
  type: business_goal
  title: Keep External Providers Replaceable
  statement: At least one external provider shall be replaceable without changing Journey core business logic.
  sources:
  - ARCH
  priority: S
  rationale: This goal defines the product outcome “keep external providers replaceable” and guides downstream capability
    and quality requirements.
  acceptanceCriteria:
  - id: BG-008-AC-01
    condition: Given two conforming implementations of one provider interface, when the configured implementation
      is replaced
    expectedResult: The Journey core test suite passes without changes to Journey domain logic.
    verificationMethod: integration_test
  useCases:
  - UC-13
  domainElements: []
  dependsOn: []
  conflictsWith: []
  verificationMethod: integration_test
  testCases: []
  status: proposed
functional_requirements:
- id: FR-001
  type: functional_requirement
  title: Manage Traveler Account
  statement: The system shall allow a traveler to create, authenticate and manage an account.
  sources:
  - UJ
  - DM
  priority: M
  rationale: This capability implements the “manage traveler account” responsibility in the mapped traveler or system
    workflow.
  acceptanceCriteria:
  - id: FR-001-AC-01
    condition: Given a new or existing traveler, when valid registration, authentication and profile-management
      actions are submitted
    expectedResult: The account is created or authenticated and authorised profile changes are persisted.
    verificationMethod: functional_test
  useCases:
  - UC-01
  domainElements:
  - name: Traveler
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-002
  type: functional_requirement
  title: Persist Long-Term Preferences
  statement: The system shall persist long-term traveler preferences and allow them to be reused when creating a
    new Journey.
  sources:
  - UJ
  - DM
  priority: M
  rationale: This capability implements the “persist long-term preferences” responsibility in the mapped traveler
    or system workflow.
  acceptanceCriteria:
  - id: FR-002-AC-01
    condition: Given a traveler who saves long-term preferences, when a new Journey is created later
    expectedResult: The saved preferences are available as defaults without being re-entered.
    verificationMethod: functional_test
  useCases:
  - UC-01
  domainElements:
  - name: Traveler
    kind: entity
  - name: Preference
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-003
  type: functional_requirement
  title: Support Journey-Specific Preferences
  statement: The system shall support Journey-specific preferences without automatically modifying the traveler's
    long-term preference profile.
  sources:
  - UJ
  - DM
  priority: M
  rationale: This capability implements the “support journey-specific preferences” responsibility in the mapped
    traveler or system workflow.
  acceptanceCriteria:
  - id: FR-003-AC-01
    condition: Given a traveler with a long-term preference profile, when a different preference is saved for one
      Journey
    expectedResult: The Journey uses the Journey-specific value and the long-term profile remains unchanged.
    verificationMethod: functional_test
  useCases:
  - UC-01
  - UC-02
  domainElements:
  - name: Preference
    kind: entity
  - name: Journey
    kind: entity
  - name: preference_scope
    kind: enum
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-004
  type: functional_requirement
  title: Expire Temporary Preferences
  statement: The system shall support temporary preferences with an expiry time and shall stop applying them after
    expiry.
  sources:
  - UJ
  - DM
  priority: S
  rationale: This capability implements the “expire temporary preferences” responsibility in the mapped traveler
    or system workflow.
  acceptanceCriteria:
  - id: FR-004-AC-01
    condition: Given a temporary preference with a validUntil time, when that time passes
    expectedResult: The preference is no longer applied to recommendation or planning decisions and is not copied
      into the long-term profile.
    verificationMethod: functional_test
  useCases:
  - UC-01
  - UC-11
  domainElements:
  - name: Preference
    kind: entity
  - name: preference_scope
    kind: enum
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-005
  type: functional_requirement
  title: Interpret Natural-Language Preferences
  statement: The system shall allow natural-language input to be interpreted as structured preferences or constraints
    for traveler review.
  sources:
  - UJ
  - AI
  priority: S
  rationale: This capability implements the “interpret natural-language preferences” responsibility in the mapped
    traveler or system workflow.
  acceptanceCriteria:
  - id: FR-005-AC-01
    condition: Given natural-language traveler input containing a preference or constraint, when the AI interpretation
      function is invoked
    expectedResult: The system returns a structured proposal that the traveler can review before it affects planning.
    verificationMethod: demonstration
  useCases:
  - UC-01
  - UC-11
  domainElements:
  - name: Preference
    kind: entity
  - name: Constraint
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: demonstration
  testCases: []
  status: proposed
- id: FR-006
  type: functional_requirement
  title: Create a Journey
  statement: The system shall create a Journey with a unique identifier.
  sources:
  - UJ
  - DM
  priority: M
  rationale: This capability implements the “create a journey” responsibility in the mapped traveler or system workflow.
  acceptanceCriteria:
  - id: FR-006-AC-01
    condition: Given an authenticated traveler and valid minimum journey input, when Create Journey is submitted
    expectedResult: A new Journey is persisted with a unique journeyId.
    verificationMethod: functional_test
  useCases:
  - UC-02
  domainElements:
  - name: Journey
    kind: entity
  - name: journey_status
    kind: enum
  - name: Journey
    kind: state_machine
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-007
  type: functional_requirement
  title: Store Core Journey Parameters
  statement: The system shall store a Journey destination, start time, end time, origin, final destination and budget
    policy.
  sources:
  - UJ
  - DM
  priority: M
  rationale: This capability implements the “store core journey parameters” responsibility in the mapped traveler
    or system workflow.
  acceptanceCriteria:
  - id: FR-007-AC-01
    condition: Given valid destination, time, origin, final-destination and budget inputs, when a Journey is saved
    expectedResult: All supplied parameters are persisted and returned unchanged when the Journey is retrieved.
    verificationMethod: functional_test
  useCases:
  - UC-02
  domainElements:
  - name: Journey
    kind: entity
  - name: Place
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-008
  type: functional_requirement
  title: Lock a Must-Go Activity
  statement: The system shall allow the traveler to mark an Activity as must-go or locked.
  sources:
  - UJ
  - DM
  priority: M
  rationale: This capability implements the “lock a must-go activity” responsibility in the mapped traveler or system
    workflow.
  acceptanceCriteria:
  - id: FR-008-AC-01
    condition: Given an editable Activity in a Journey, when the traveler marks it as must-go or locked
    expectedResult: The Activity is associated with the corresponding commitment strength and the lock is visible
      in the plan.
    verificationMethod: functional_test
  useCases:
  - UC-02
  - UC-03
  domainElements:
  - name: Activity
    kind: entity
  - name: Commitment
    kind: entity
  - name: commitment_strength
    kind: enum
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-009
  type: functional_requirement
  title: Record Existing Commitments
  statement: The system shall allow the traveler to enter existing fixed arrangements such as tickets, reservations
    or transport schedules as Journey commitments.
  sources:
  - UJ
  - DM
  priority: M
  rationale: This capability implements the “record existing commitments” responsibility in the mapped traveler
    or system workflow.
  acceptanceCriteria:
  - id: FR-009-AC-01
    condition: Given valid details for an existing ticket, reservation or fixed schedule, when the traveler adds
      it to a Journey
    expectedResult: A Commitment is created with its source, time window and selected strength.
    verificationMethod: functional_test
  useCases:
  - UC-02
  - UC-03
  domainElements:
  - name: Commitment
    kind: entity
  - name: commitment_source_type
    kind: enum
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-010
  type: functional_requirement
  title: Generate an Executable Candidate Plan
  statement: Given valid Journey parameters and satisfiable mandatory constraints, the system shall generate at
    least one executable candidate plan.
  sources:
  - UJ
  - OPT
  priority: M
  rationale: This capability implements the “generate an executable candidate plan” responsibility in the mapped
    traveler or system workflow.
  acceptanceCriteria:
  - id: FR-010-AC-01
    condition: Given valid Journey parameters and satisfiable active mandatory constraints, when plan generation
      is requested
    expectedResult: At least one candidate PlanVersion is produced and passes all applicable system-hard and normal-mode
      commitment-hard constraints.
    verificationMethod: system_test
  useCases:
  - UC-04
  domainElements:
  - name: Journey
    kind: entity
  - name: PlanVersion
    kind: entity
  - name: Constraint
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: system_test
  testCases: []
  status: proposed
- id: FR-011
  type: functional_requirement
  title: Support Multiple Planning Modes
  statement: The system shall support at least two planning modes or weighting policies.
  sources:
  - OPT
  priority: S
  rationale: This capability implements the “support multiple planning modes” responsibility in the mapped traveler
    or system workflow.
  acceptanceCriteria:
  - id: FR-011-AC-01
    condition: Given the same Journey input, when plans are generated under two supported planning modes
    expectedResult: Each candidate records the selected planningMode and scoringPolicyVersion, and the score breakdown
      reflects the corresponding weighting policy.
    verificationMethod: functional_test
  useCases:
  - UC-04
  domainElements:
  - name: PlanVersion
    kind: entity
  - name: planning_mode
    kind: enum
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-012
  type: functional_requirement
  title: Edit and Revalidate an Activity
  statement: The traveler shall be able to edit an unlocked Activity and the system shall revalidate plan feasibility
    after the change.
  sources:
  - UJ
  - DM
  priority: M
  rationale: This capability implements the “edit and revalidate an activity” responsibility in the mapped traveler
    or system workflow.
  acceptanceCriteria:
  - id: FR-012-AC-01
    condition: Given an unlocked Activity in a draft or editable plan, when the traveler changes its time, place
      or duration
    expectedResult: The change is saved to a new or editable candidate version and plan feasibility is recalculated
      before activation.
    verificationMethod: functional_test
  useCases:
  - UC-02
  - UC-04
  domainElements:
  - name: Activity
    kind: entity
  - name: PlanVersion
    kind: entity
  - name: activity_status
    kind: enum
  - name: Activity
    kind: state_machine
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-013
  type: functional_requirement
  title: Version Confirmed Plans
  statement: Each confirmed plan shall be represented by an independent PlanVersion.
  sources:
  - DM
  priority: M
  rationale: This capability implements the “version confirmed plans” responsibility in the mapped traveler or system
    workflow.
  acceptanceCriteria:
  - id: FR-013-AC-01
    condition: Given two separately confirmed plan states for one Journey, when persisted data is inspected
    expectedResult: They are represented by distinct PlanVersion identifiers and version numbers.
    verificationMethod: inspection
  useCases:
  - UC-04
  - UC-10
  - UC-12
  domainElements:
  - name: PlanVersion
    kind: entity
  - name: plan_version_status
    kind: enum
  - name: PlanVersion
    kind: state_machine
  dependsOn: []
  conflictsWith: []
  verificationMethod: inspection
  testCases: []
  status: proposed
- id: FR-014
  type: functional_requirement
  title: Maintain a Single Active Plan
  statement: A Journey shall have at most one active PlanVersion at any time.
  sources:
  - DM
  priority: M
  rationale: This capability implements the “maintain a single active plan” responsibility in the mapped traveler
    or system workflow.
  acceptanceCriteria:
  - id: FR-014-AC-01
    condition: Given a Journey with an active PlanVersion, when another PlanVersion is activated
    expectedResult: The previous version is no longer active and exactly one version remains active.
    verificationMethod: system_test
  useCases:
  - UC-08
  domainElements:
  - name: Journey
    kind: entity
  - name: PlanVersion
    kind: entity
  - name: plan_version_status
    kind: enum
  - name: PlanVersion
    kind: state_machine
  dependsOn: []
  conflictsWith: []
  verificationMethod: system_test
  testCases: []
  status: proposed
- id: FR-015
  type: functional_requirement
  title: Compare Plan Versions
  statement: The system shall allow two PlanVersions to be compared and shall show Activity changes between them.
  sources:
  - DM
  priority: S
  rationale: This capability implements the “compare plan versions” responsibility in the mapped traveler or system
    workflow.
  acceptanceCriteria:
  - id: FR-015-AC-01
    condition: Given two PlanVersions belonging to the same Journey, when the traveler requests a comparison
    expectedResult: The system identifies added, removed, moved and materially changed Activities.
    verificationMethod: functional_test
  useCases:
  - UC-12
  domainElements:
  - name: PlanVersion
    kind: entity
  - name: Activity
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-016
  type: functional_requirement
  title: Expose Journey Twin Status
  statement: Journey Twin shall expose current time, current location, current Activity, remaining budget and the
    next important commitment.
  sources:
  - DM
  - UJ
  priority: M
  rationale: This capability implements the “expose journey twin status” responsibility in the mapped traveler or
    system workflow.
  acceptanceCriteria:
  - id: FR-016-AC-01
    condition: Given an active Journey with current context and plan data, when Journey Twin is queried
    expectedResult: The response includes current time, current location, current Activity, remaining budget and
      the next important commitment when available.
    verificationMethod: functional_test
  useCases:
  - UC-08
  domainElements:
  - name: JourneyTwin
    kind: entity
  - name: Activity
    kind: entity
  - name: Commitment
    kind: entity
  dependsOn: []
  conflictsWith: []
  verificationMethod: functional_test
  testCases: []
  status: proposed
- id: FR-017
  type: functional_requirement
  title: Derive Journey Health
  statement: The system shall derive and display the Journey health state as OnTrack, AtRisk, Disrupted or Replanning.
  sources:
  - DM
  - OPT
  priority: M
  rationale: This capability implements the “derive journey health” responsibility in the mapped traveler or system
    workflow.
  acceptanceCriteria:
  - id: FR-017-AC-01
    condition: Given Journey Twin fixtures representing normal progress, emerging risk, confirmed disruption and
      active replanning, when health is derived
    expectedResult: The domain states healthy, at_risk, disrupted and replanning are produced respectively and displayed
      as On Track, At Risk, Disrupted and Replanning.
    verificationMethod: system_test
  useCases:
  - UC-08
  - UC-09
  - UC-10
  domainElements:
  - name: JourneyTwin
    kind: entity
  - name: journey_health
    kind: enum
  dependsOn: []
  conflictsWith: []
  verificationMethod: system_test
  testCases: []
  status: proposed
- id: FR-018
  type: functional_requirement
  title: Search Places
  statement: The system shall allow locations to be searched by name or category.
  sources:
  - UJ
  - GH-TS
  priority: M
  rationale: This capability implements the “search places” responsibility in the mapped traveler or system workflow.
  acceptanceCriteria:
  - id: FR-018-AC-01
    condition: Given a place name query or supported category filter, when a location search is submitted
    expectedResult: The system returns matching real-provider Place records or an explicit empty result.
    verificationMethod: functional_test
  useCases:
  - UC-05
  domainElements:
