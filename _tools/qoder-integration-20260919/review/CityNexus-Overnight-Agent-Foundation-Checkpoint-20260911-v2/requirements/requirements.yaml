  conflictsWith: []
  verificationMethod: system_test
  testCases: []
  status: proposed
- id: BR-002
  type: business_rule
  title: Activated Plans Are Immutable
  statement: An activated PlanVersion shall not be modified in place; changes shall use a new draft or version.
  sources:
  - DM
  priority: M
  rationale: This rule preserves domain consistency for “activated plans are immutable” and prevents invalid or
    unauthorised journey behaviour.
  acceptanceCriteria:
  - id: BR-002-AC-01
