business_rules:
- id: BR-001
  type: business_rule
  title: Single Active Plan Version
  statement: A Journey shall have at most one active PlanVersion.
  sources:
  - DM
  priority: M
  rationale: This rule preserves domain consistency for “single active plan version” and prevents invalid or unauthorised
    journey behaviour.
  acceptanceCriteria:
  - id: BR-001-AC-01
    condition: Given a Journey with one active PlanVersion, when another PlanVersion is activated
    expectedResult: The new version becomes active and no second active version remains.
    verificationMethod: system_test
  useCases:
  - UC-04
  - UC-08
  - UC-10
  domainElements:
  - name: Journey
    kind: entity
  - name: PlanVersion
    kind: entity
  - name: DR-009
