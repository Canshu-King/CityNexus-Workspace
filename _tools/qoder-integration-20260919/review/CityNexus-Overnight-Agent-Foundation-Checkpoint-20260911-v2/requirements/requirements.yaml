  - DM
  priority: M
  rationale: This rule preserves domain consistency for “derive commitment strength from multiple factors” and prevents
    invalid or unauthorised journey behaviour.
  acceptanceCriteria:
  - id: BR-011-AC-01
    condition: Given representative paid-low-impact and unpaid-fixed-schedule commitments, when strength determination
      is analysed
    expectedResult: The fixed schedule may receive higher strength than the low-impact payment and the decision
      evidence includes the defined factors.
    verificationMethod: analysis
  useCases:
  - UC-03
  domainElements:
