- id: UC-09
  name: Detect & Assess Journey Events
  level: user_goal
  primaryActor: ACT-CONTEXT
  supportingActors: []
  goal: Validate Journey-relevant events, assess their impact, and decide whether to update, suggest replanning,
    or trigger critical replanning.
  preconditions:
  - A Journey exists.
  trigger: A user, provider, mobility, weather, or system event relevant to the Journey is received.
  mainSuccessScenario:
  - id: MS-01
    actor: System
    action: Receives and normalises the Event with source and observation metadata.
  - id: MS-02
    actor: System
    action: Validates schema, source, freshness, expiry, and confidence as applicable.
  - id: MS-03
    actor: System
    action: Maps the valid Event to affected Activities or Constraints.
  - id: MS-04
    actor: System
    action: Updates valid context and JourneyTwin information without allowing the Event to mutate the plan directly.
  - id: MS-05
    actor: System
    action: Assesses impact on the active PlanVersion and Journey health.
  - id: MS-06
    actor: System
    action: Classifies the Event as Update Only, Suggest Replan, or Critical Replan.
  - id: MS-07
    actor: System
    action: Records processing status and the resulting decision.
  - id: MS-08
    actor: System
    action: If replanning is required, UC-10 may extend this use case.
  alternateFlows:
  - id: A1
    name: Update only
    description: The system updates JourneyTwin and does not create a ReplanProposal.
  - id: A2
    name: Suggest replan
    description: The system surfaces a recommendation to replan while preserving the current plan until the Traveler
      proceeds.
  exceptionFlows:
  - id: E1
    name: Expired event
    description: An expired Event is marked ignored/expired and cannot automatically trigger replanning.
  - id: E2
    name: Invalid event
    description: Malformed or untrusted event data is rejected or ignored and logged appropriately.
  postconditions:
  - The Event has a traceable processing result.
  - Any replan decision is based only on valid, sufficiently fresh facts.
