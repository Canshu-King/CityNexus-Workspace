- id: UC-11
  name: Use AI Journey Copilot
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-AI
  goal: Use natural language for intent/preferences and explanations without granting AI authority over feasibility
    or persisted Journey state.
  preconditions:
  - The Traveler can access a Journey or preference context.
  trigger: The Traveler enters a natural-language request such as a preference change or asks for an explanation.
  mainSuccessScenario:
  - id: MS-01
    actor: Traveler
    action: Enters natural-language intent or a question.
  - id: MS-02
    actor: System
    action: Sends only the minimum required structured context to the configured AIProvider.
  - id: MS-03
    actor: AI Provider
    action: Returns extracted intent, preference candidates, semantic scores, or explanation text depending on the
      request.
  - id: MS-04
    actor: System
    action: Validates structured AI output against application schemas and domain rules.
  - id: MS-05
    actor: System
    action: Presents any extracted Preference or Constraint proposal for Traveler review.
  - id: MS-06
    actor: Traveler
    action: Confirms, edits, or rejects the proposed structured change.
  - id: MS-07
    actor: System
    action: Applies confirmed structured data through normal business logic and, if planning is needed, invokes
      deterministic planner capabilities.
  - id: MS-08
    actor: System
    action: Presents an explanation grounded in the actual structured recommendation, plan, score, or Event facts.
  alternateFlows:
  - id: A1
    name: AI unavailable
    description: The Traveler uses manual structured controls; deterministic Journey, planning, and constraints
      remain functional.
  - id: A2
    name: Low-confidence extraction
    description: The system asks for review/correction rather than persisting uncertain AI output automatically.
  exceptionFlows:
  - id: E1
    name: Invalid AI output
    description: Schema-invalid or business-rule-invalid AI output is rejected and does not mutate persistence.
  - id: E2
    name: AI timeout
    description: The core deterministic operation returns or remains available without waiting indefinitely for
      AI.
  postconditions:
  - No AI response has directly written persisted Journey state.
  - Any applied change has passed normal validation and Traveler confirmation rules.
