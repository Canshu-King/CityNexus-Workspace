- id: UC-05
  name: Discover & Recommend City Services
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-CITY-DATA
  - ACT-AI
  goal: Recommend grounded Places and CityServices that fit the current Journey context without violating hard constraints.
  preconditions:
  - A Journey exists and current Journey context is available.
  trigger: The Traveler searches for a place/service or CityNexus identifies a contextual recommendation opportunity.
  mainSuccessScenario:
  - id: MS-01
    actor: System
    action: Reads the current JourneyTwin and relevant preference, budget, time, mobility, and commitment context.
  - id: MS-02
    actor: System
    action: Retrieves real Place and CityService candidates from configured providers.
  - id: MS-03
    actor: System
    action: Normalises provider data and discards candidates that cannot be grounded to a source.
  - id: MS-04
    actor: System
    action: Applies active hard constraints and removes infeasible candidates.
  - id: MS-05
    actor: System
    action: Computes reproducible contextual scores for feasible candidates.
  - id: MS-06
    actor: System
    action: When a safe Opportunity Window exists, verifies that a recommendation cannot make the next hard commitment
      late.
  - id: MS-07
    actor: System
    action: Optionally obtains AI semantic matching or explanation using only grounded structured candidate data.
  - id: MS-08
    actor: System
    action: Presents ranked recommendations with structured evidence and an understandable rationale.
  - id: MS-09
    actor: Traveler
    action: Reviews a recommendation and may choose it for planning or booking.
  alternateFlows:
  - id: A1
    name: AI unavailable
    description: Deterministic filtering and scoring continue; semantic explanation may be reduced or unavailable.
  - id: A2
    name: No Opportunity Window
    description: The system omits opportunistic additions and continues to show only feasible normal recommendations.
  exceptionFlows:
  - id: E1
    name: No grounded candidates
    description: The system returns an explicit empty result rather than inventing a Place or CityService.
  - id: E2
    name: Provider data stale
    description: Expired or insufficiently valid provider facts are not treated as authoritative executable data.
  postconditions:
  - Displayed executable recommendations are grounded and feasible under applicable constraints.
