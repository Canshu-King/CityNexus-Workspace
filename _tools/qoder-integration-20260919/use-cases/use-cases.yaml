- id: UC-01
  name: Manage Account & Preferences
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-AUTH
  - ACT-AI
  goal: Maintain an authenticated traveler profile and reviewable long-term, Journey-scoped, and temporary preferences.
  preconditions:
  - The CityNexus application is available.
  trigger: The Traveler opens account or preference management.
  mainSuccessScenario:
  - id: MS-01
    actor: Traveler
    action: Creates an account or signs in.
  - id: MS-02
    actor: System
    action: Authenticates the Traveler through the configured authentication capability.
  - id: MS-03
    actor: System
    action: Loads the Traveler profile and persisted long-term preferences.
  - id: MS-04
    actor: Traveler
    action: Creates, edits, or removes reviewable preference values.
  - id: MS-05
    actor: System
    action: Validates preference scope, value, weight, and expiry data.
  - id: MS-06
    actor: Traveler
    action: Optionally enters free-text intent for preference extraction.
  - id: MS-07
    actor: System
    action: If AI is available, presents extracted structured preference or constraint candidates without persisting
      them automatically.
  - id: MS-08
    actor: Traveler
    action: Reviews and confirms the structured changes.
  - id: MS-09
    actor: System
    action: Persists confirmed preferences with their scope and validity period.
  alternateFlows:
  - id: A1
    name: Existing account
    description: At step 1, the Traveler signs in instead of registering; the flow resumes at step 2.
  - id: A2
    name: Manual preference entry
    description: If AI is unavailable or not selected at step 6, the Traveler enters structured preferences manually
      and the flow resumes at step 8.
  - id: A3
    name: Temporary preference expiry
    description: When a temporary preference expires, the system stops applying it without modifying the long-term
      profile.
  exceptionFlows:
  - id: E1
    name: Authentication failure
    description: At step 2, authentication failure leaves protected account data unavailable and returns an explicit
      error.
  - id: E2
    name: Invalid preference
    description: At step 5, invalid structured data is rejected and the Traveler is asked to correct it.
  postconditions:
  - Confirmed preferences are persisted with explicit scope and validity.
  - AI output, if used, has not directly mutated persisted Journey state.
  requirementIds:
