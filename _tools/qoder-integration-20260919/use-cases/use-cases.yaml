- id: UC-07
  name: Make Secure Payment
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-PAYMENT
  - ACT-AUTH
  goal: Complete or fail a payment safely, record the authoritative PaymentTransaction outcome, and provide a traceable
    receipt reference.
  preconditions:
  - A payable Order or Booking context exists.
  trigger: Payment is required while completing UC-06.
  mainSuccessScenario:
  - id: MS-01
    actor: System
    action: Creates a PaymentTransaction in an initiated state for exactly one payment subject.
  - id: MS-02
    actor: System
    action: Determines whether policy requires additional WebAuthn/passkey authentication.
  - id: MS-03
    actor: Traveler
    action: Completes required authentication when prompted.
  - id: MS-04
    actor: System
    action: Initiates payment through the configured Payment Adapter without exposing private provider credentials
      to the frontend.
  - id: MS-05
    actor: System
    action: Retrieves and persists the final provider-authoritative payment outcome.
  - id: MS-06
    actor: System
    action: On success, stores the receipt or provider transaction reference.
  - id: MS-07
    actor: System
    action: Updates related commercial and commitment information without using payment alone as the definition
      of commitment strength.
  - id: MS-08
    actor: Traveler
    action: Views the payment result.
  alternateFlows:
  - id: A1
    name: No step-up authentication
    description: If policy does not require WebAuthn at step 2, the flow continues at step 4.
  - id: A2
    name: Refund
    description: A permitted refund creates an auditable refunded or partially-refunded PaymentTransaction outcome.
  exceptionFlows:
  - id: E1
    name: Authentication failure
    description: The payment is not submitted when required authentication fails.
  - id: E2
    name: Payment failure
    description: The failed provider outcome is persisted and the Order/Booking is not falsely marked paid.
  postconditions:
  - The PaymentTransaction reflects the provider-authoritative outcome.
  - Sensitive payment credentials are not persisted.
  requirementIds:
  - BG-002
  - FR-029
  - FR-036
  - FR-037
  - FR-038
  - BR-018
