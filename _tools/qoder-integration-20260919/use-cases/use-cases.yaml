- id: UC-02
  name: Create & Configure Journey
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-AI
  goal: Create a Journey with the timing, locations, budget, preferences, must-go items, and existing commitments
    needed for planning.
  preconditions:
  - The Traveler can access CityNexus.
  trigger: The Traveler chooses to create a new Journey.
  mainSuccessScenario:
  - id: MS-01
    actor: Traveler
    action: Starts a new Journey.
  - id: MS-02
    actor: System
    action: Creates a Journey with a unique identifier and Draft lifecycle state.
  - id: MS-03
    actor: Traveler
    action: Enters destination city, origin, final destination, start time, end time, and budget policy.
  - id: MS-04
    actor: Traveler
    action: Adds Journey-specific interests and preferences.
  - id: MS-05
    actor: Traveler
    action: Marks must-go or locked Activities where applicable.
  - id: MS-06
    actor: Traveler
    action: Adds existing tickets, reservations, or fixed transport arrangements as commitments.
  - id: MS-07
    actor: Traveler
    action: Optionally provides natural-language travel intent.
  - id: MS-08
    actor: System
    action: If AI is used, converts the input into reviewable structured time, budget, preference, or constraint
      proposals.
  - id: MS-09
    actor: Traveler
    action: Reviews and confirms all Journey configuration.
  - id: MS-10
    actor: System
    action: Validates the Journey configuration and persists the Draft Journey.
  alternateFlows:
  - id: A1
    name: No existing commitments
    description: If the Traveler has no fixed arrangements at step 6, the flow continues at step 7.
  - id: A2
    name: Manual structured input
    description: If AI is unavailable at step 8, the Traveler completes structured fields manually.
  - id: A3
    name: Edit before planning
    description: The Traveler may edit unlocked configuration before plan generation; affected feasibility is revalidated
      when a plan exists.
  exceptionFlows:
  - id: E1
    name: Invalid time range
    description: If end time is not after start time, the system rejects the configuration.
  - id: E2
    name: Invalid budget or location
    description: Invalid required Journey data is rejected with field-level feedback.
  postconditions:
  - A valid Draft Journey exists.
  - Journey-scoped preferences and entered commitments are linked to the Journey.
