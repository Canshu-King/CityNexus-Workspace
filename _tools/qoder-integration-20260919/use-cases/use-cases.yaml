- id: UC-08
  name: Execute Journey
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-MOBILITY
  goal: Present the live executable Journey state while the Traveler follows the active plan.
  preconditions:
  - The Journey has an active PlanVersion.
  trigger: The Traveler enters Journey execution mode.
  mainSuccessScenario:
  - id: MS-01
    actor: System
    action: Loads the active PlanVersion and current Activities.
  - id: MS-02
    actor: System
    action: Refreshes current time, location, mobility, and available context into ContextSnapshot data.
  - id: MS-03
    actor: System
    action: Projects Journey, active PlanVersion, commitments, constraints, events, and context into JourneyTwin.
  - id: MS-04
    actor: System
    action: Shows current Activity, next Activity, remaining budget, delay, walking distance, and next hard commitment.
  - id: MS-05
    actor: System
    action: Derives and displays Journey health as OnTrack, AtRisk, Disrupted, or Replanning.
  - id: MS-06
    actor: System
    action: Identifies a safe Opportunity Window when applicable.
  - id: MS-07
    actor: Traveler
    action: Uses the displayed guidance to continue the Journey.
  - id: MS-08
    actor: System
    action: When a Journey-relevant event is detected, UC-09 may extend this use case.
  alternateFlows:
  - id: A1
    name: Non-core provider unavailable
    description: Existing Journey data remains accessible and execution continues with degraded live context where
      possible.
  exceptionFlows:
  - id: E1
    name: No active plan
    description: The system does not enter normal execution mode and directs the Traveler to create or select an
      executable plan.
  postconditions:
  - JourneyTwin reflects the latest valid available context and active plan state.
