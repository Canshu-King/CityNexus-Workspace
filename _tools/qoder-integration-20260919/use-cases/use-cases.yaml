- id: UC-03
  name: Manage Journey Commitments
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-BOOKING
  - ACT-PAYMENT
  goal: Represent and manage real-world obligations with explicit source, lifecycle status, and commitment strength.
  preconditions:
  - A Journey exists.
  trigger: The Traveler locks an Activity or a booking, payment, or external schedule creates a real-world obligation.
  mainSuccessScenario:
  - id: MS-01
    actor: Traveler
    action: Selects an Activity or real-world arrangement to manage.
  - id: MS-02
    actor: System
    action: Identifies the commitment source such as user lock, booking, payment, or external schedule.
  - id: MS-03
    actor: System
    action: Creates or updates a Commitment linked to the Journey and, when applicable, an Activity.
  - id: MS-04
    actor: System
    action: Determines or presents commitment strength from C0 Flexible through C4 Anchored using time rigidity,
      financial loss, external responsibility, and user lock.
  - id: MS-05
    actor: System
    action: Displays the commitment strength and expected impact of changing it.
  - id: MS-06
    actor: Traveler
    action: Reviews and confirms any change that materially affects a C2 or C3 commitment.
  - id: MS-07
    actor: System
    action: Persists the confirmed commitment state and relevant source reference.
  alternateFlows:
  - id: A1
    name: C4 anchored item
    description: A C4 commitment remains anchored unless the Traveler explicitly changes it or an authorised exception
      policy applies.
  - id: A2
    name: Cancellation
    description: A provider-confirmed cancellation updates the relevant Booking and Commitment status without silently
      rewriting unrelated commitments.
  exceptionFlows:
  - id: E1
    name: Provider status unavailable
    description: The system does not invent provider confirmation; the current known status is retained and the
      uncertainty is surfaced.
  postconditions:
  - The Journey has an auditable commitment representation.
  - Strength and lifecycle status remain separate concepts.
