    actor: System
    action: Lists available PlanVersions for the Journey.
  - id: MS-02
    actor: Traveler
    action: Selects one or two PlanVersions to inspect or compare.
  - id: MS-03
    actor: System
    action: Shows Activity changes, timing, estimated/actual cost information, and commitment impacts where available.
  - id: MS-04
    actor: System
    action: Shows the ReplanProposal trigger, change reason, and Traveler decision associated with revised plans.
  - id: MS-05
    actor: System
    action: Shows traceable Booking, Order, PaymentTransaction, or receipt references when relevant.
  - id: MS-06
    actor: Traveler
