- id: UC-06
  name: Book & Order City Services
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-BOOKING
  goal: Book or order a supported CityService while preserving authoritative provider outcomes and Journey commitment
    effects.
  preconditions:
  - The Traveler has selected a supported CityService.
  trigger: The Traveler chooses to book, reserve, cancel, or order a CityService.
  mainSuccessScenario:
  - id: MS-01
    actor: System
    action: Retrieves provider-supported availability windows or slots where applicable.
  - id: MS-02
    actor: Traveler
    action: Selects an available service option.
  - id: MS-03
    actor: System
    action: Creates a Booking or Order request through the configured adapter.
  - id: MS-04
    actor: System
    action: Receives the provider outcome and persists the authoritative Booking or Order state.
  - id: MS-05
    actor: System
    action: Creates or strengthens a Journey Commitment when the confirmed commercial state produces a real-world
      obligation.
  - id: MS-06
    actor: System
    action: Shows the resulting status and any cancellation or fulfilment information.
  - id: MS-07
    actor: System
    action: If payment is required, invokes UC-07 Make Secure Payment as an extension.
  alternateFlows:
  - id: A1
    name: Cancellation
    description: The Traveler requests cancellation; the Booking Adapter returns the authoritative outcome and the
      system updates affected commitment information.
  - id: A2
    name: Order without reservation
    description: A tradable CityService may create an Order directly without a Booking when supported.
  exceptionFlows:
  - id: E1
    name: Provider rejection
    description: A rejected or failed booking/order request is stored or surfaced as an explicit failure and is
      not represented as confirmed.
  postconditions:
  - Booking or Order state reflects the provider outcome.
  - Any resulting Commitment is traceable to its source.
