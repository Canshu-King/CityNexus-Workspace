- id: UC-10
  name: Replan Disrupted Journey
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-CITY-DATA
  - ACT-MOBILITY
  - ACT-AI
  goal: Recover an affected Journey with the least disruptive feasible plan while preserving commitments and requiring
    explicit acceptance for major changes.
  preconditions:
  - A Journey with an active PlanVersion exists.
  - A relevant Event or context change has been assessed.
  trigger: The system determines that replanning is suggested or required, or the Traveler explicitly requests recovery.
  mainSuccessScenario:
  - id: MS-01
    actor: System
    action: Updates JourneyTwin using the validated event and latest valid context.
  - id: MS-02
    actor: System
    action: Checks whether the active PlanVersion remains executable.
  - id: MS-03
    actor: System
    action: Identifies affected Activities, Constraints, and Commitments.
  - id: MS-04
    actor: System
    action: Freezes C4 Anchored commitments and applies normal C2/C3 confirmation rules.
  - id: MS-05
    actor: System
    action: Attempts Local Repair of the affected current and near-term Activities.
  - id: MS-06
    actor: System
    action: If no feasible local result exists, expands to Window Replan.
  - id: MS-07
    actor: System
    action: If no feasible window result exists, expands to Global Replan for the remaining Journey.
  - id: MS-08
    actor: System
    action: Retrieves any required grounded city and mobility data and builds legal candidate plans.
  - id: MS-09
    actor: System
    action: Rejects hard-constraint violations and scores feasible CandidatePlans with a reproducible ScoreBreakdown.
  - id: MS-10
    actor: System
    action: Ranks feasible candidates and prepares old-versus-new change summaries including Activities, time, cost,
      travel burden, and commitments.
  - id: MS-11
    actor: System
    action: Optionally obtains an AI explanation grounded only in the supplied structured plan/event facts.
  - id: MS-12
    actor: System
    action: Presents the proposal and candidate comparison to the Traveler.
  - id: MS-13
    actor: Traveler
    action: Accepts or rejects the proposed major change.
  - id: MS-14
    actor: System
    action: If accepted, atomically activates the chosen new immutable PlanVersion and retains the prior version.
  - id: MS-15
    actor: System
    action: Records trigger, reason, selected candidate, Traveler decision, and resulting Journey state.
  alternateFlows:
  - id: A1
    name: Local Repair succeeds
    description: If step 5 yields a feasible solution, Window and Global Replan are skipped and the flow resumes
      at scoring/comparison.
  - id: A2
    name: Window Replan succeeds
    description: If step 6 yields a feasible solution, Global Replan is skipped.
  - id: A3
    name: AI unavailable
    description: Deterministic replanning, scoring, comparison, and acceptance continue without AI explanation.
  - id: A4
    name: Traveler rejects proposal
    description: The current active plan remains unchanged; the rejection is recorded and no candidate PlanVersion
      becomes active.
  exceptionFlows:
  - id: E1
    name: No normal feasible plan
    description: After Local, Window, and Global scopes fail, the system enters Exception Mode only according to
      explicit relaxationPolicy and Traveler confirmation rules.
  - id: E2
    name: No feasible plan after Exception Mode
    description: The ReplanProposal records no_feasible_plan with a failure reason; no invalid candidate is activated.
  - id: E3
    name: Provider failure
    description: Configured fallback/mock capability may support the demo, but hard-constraint and grounding rules
      are not bypassed.
  postconditions:
  - If accepted, exactly one active PlanVersion exists and previous versions remain queryable.
  - If rejected or impossible, no invalid plan is activated.
  - The replanning audit trail retains trigger and change reason.
