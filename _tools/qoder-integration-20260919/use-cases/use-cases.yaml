- id: UC-04
  name: Generate & Select Journey Plan
  level: user_goal
  primaryActor: ACT-TRAVELER
  supportingActors:
  - ACT-CITY-DATA
  - ACT-MOBILITY
  goal: Generate feasible, scored Journey plans from grounded city data and let the Traveler select an immutable
    plan version.
  preconditions:
  - A valid Journey configuration exists.
  trigger: The Traveler requests plan generation or regeneration.
  mainSuccessScenario:
  - id: MS-01
    actor: System
    action: Retrieves grounded city data needed for candidate Activities.
  - id: MS-02
    actor: System
    action: Obtains route distance and travel-time estimates through the mobility integration.
  - id: MS-03
    actor: System
    action: Builds active System Hard, Commitment Hard, and Soft planning constraints.
  - id: MS-04
    actor: System
    action: Generates candidate PlanVersions according to the selected planning mode or weighting policy.
  - id: MS-05
    actor: System
    action: Rejects candidates that violate applicable hard constraints.
  - id: MS-06
    actor: System
    action: Scores feasible candidates using the configured scoring policy.
  - id: MS-07
    actor: System
    action: Presents one or more executable candidate plans and their relevant score information.
  - id: MS-08
    actor: Traveler
    action: Reviews the candidates and selects a preferred plan.
  - id: MS-09
    actor: System
    action: Marks the selected PlanVersion Accepted and makes it the Journey active PlanVersion atomically.
  - id: MS-10
    actor: System
    action: Retains the accepted PlanVersion as immutable history.
  alternateFlows:
  - id: A1
    name: Multiple planning modes
    description: The Traveler may request another supported planning mode; candidates are regenerated with a reproducible
      scoring policy.
  - id: A2
    name: Provider fallback
    description: If a non-core provider fails, configured fallback or mock data may be used without bypassing grounding
      and validation rules.
  exceptionFlows:
  - id: E1
    name: No feasible plan
    description: If mandatory constraints cannot be satisfied, the system returns an explicit no-feasible-plan result
      instead of activating an invalid plan.
  postconditions:
  - At most one active PlanVersion exists for the Journey.
  - An activated PlanVersion is immutable.
