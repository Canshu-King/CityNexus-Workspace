- UC-04.x, UC-05.x and UC-10.x are focused Part 2 documentation sub-use-cases used for UML detail, not additional
  top-level requirements scope.
- Temporal workflow is not represented with include/extend unless the relationship expresses optional extension
  or reusable included capability.
- The internal planning solver is not an actor.
- AI Provider may suggest, extract, score semantically, or explain, but does not own feasibility or persistence
  mutation authority.
