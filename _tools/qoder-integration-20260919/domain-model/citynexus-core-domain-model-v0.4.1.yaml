  - weighted_penalty
state_machines:
  Journey:
    initial: draft
    transitions:
    - from: draft
      event: plan_selected
      to: planned
    - from: planned
      event: journey_started
      to: active
    - from: active
      event: pause_requested
      to: paused
    - from: paused
      event: resume_requested
      to: active
    - from: active
      event: journey_completed
      to: completed
    - from:
      - draft
      - planned
      - active
      - paused
      event: cancel_requested
      to: cancelled
  Commitment:
    initial: pending
    transitions:
    - from: pending
      event: confirm
      to: confirmed
    - from: confirmed
      event: fulfil
      to: fulfilled
    - from:
      - pending
      - confirmed
      event: cancel
      to: cancelled
