domain_rules:
- id: DR-001
  name: Hard constraints and Exception Mode
  rule: system_hard constraints are never relaxed; commitment_hard constraints may be relaxed only in Exception Mode under relaxationPolicy and after explicit Traveler confirmation; Exception Mode is entered only when no normal feasible candidate exists.
- id: DR-002
  name: Commitment preservation
  rule: C4_Anchored commitments cannot be automatically moved or deleted. Major changes to C2_Reserved or C3_Guaranteed commitments require explicit Traveler confirmation and must surface financial/time impact. C0/C1 may be changed with the configured penalty.
- id: DR-003
  name: Reality before recommendation
  rule: Candidates must come from verified city data before semantic personalisation is applied.
- id: DR-004
  name: User confirmation
  rule: A ReplanProposal never changes the active plan without Traveler confirmation.
- id: DR-005
  name: Explainability
  rule: Every Recommendation retains evidence and a human-readable reason. Every accepted ReplanProposal retains its trigger, selected CandidatePlan, ScoreBreakdown and rationale.
- id: DR-006
  name: Graceful degradation
  rule: If AI is unavailable, deterministic planning and constraint validation remain available.
- id: DR-007
  name: Context freshness
  rule: JourneyTwin projects real-time context from the newest non-expired ContextSnapshot.
- id: DR-008
  name: Progressive replanning
  rule: Replanning attempts Local Repair first, then Window Replan, then Global Replan. Exception Mode is entered only when no normal feasible candidate exists.
- id: DR-009
  name: Plan version immutability
  rule: An activated PlanVersion is immutable. Accepting a replan creates and activates a new PlanVersion while preserving the previous version for audit and comparison.
- id: DR-010
  name: AI authority boundary
  rule: AI output may propose preferences, semantic scores, recommendations or explanations, but it cannot directly mutate persisted Journey state or bypass deterministic feasibility checks.
replanning_score:
  name: Contextual Journey Utility Score
  scale: 0..100
  component_scale: 0..1
  dimensions:
  - commitmentPreservation
  - stability
  - timeReliability
  - preferenceFit
  - mobilityFit
  - budgetFit
  - robustness
  - opportunityValue
  prerequisites:
  - system_hard_constraint_validation_passed
  - normal_mode_commitment_hard_constraints_satisfied_or_exception_mode_explicitly_authorised
  formula:
    commitmentPreservation:
      weight: 0.24
      description: Preserve high-strength commitments and minimise commitment impact.
    stability:
      weight: 0.18
      description: minimise unnecessary changes from active plan
    timeReliability:
      weight: 0.15
      description: preserve arrival buffers and opening windows
    preferenceFit:
      weight: 0.12
      description: match explicit and semantic preferences
    mobilityFit:
      weight: 0.1
      description: Minimise walking, transfers and overall travel burden.
    budgetFit:
      weight: 0.08
      description: remain within or close to budget policy
    robustness:
      weight: 0.07
      description: tolerate small delays and stale data
    opportunityValue:
      weight: 0.06
      description: use safe free time for valuable additions
  penalty_terms:
  - stale_data
  - unknown_opening_status
  - excessive_risk
  - commitment_cancellation_cost
  final_score_expression: 100 * weighted_component_sum - riskPenalty
  decision_policy:
  - If the active plan remains feasible, compare scoreDelta and modify only when worthwhile under the configured threshold.
  - If the active plan is infeasible, rank all feasible CandidatePlan instances by finalScore.
  - Enter Exception Mode only when no normal constraint-satisfying candidate exists.
