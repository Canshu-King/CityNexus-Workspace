openapi: 3.1.0
info:
  title: CityNexus MVP API
  version: 0.1.0
  description: >-
    Coursework MVP contract. Deterministic feasibility is authoritative; AI is optional.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /demo/reset:
    post:
      operationId: resetDemo
      responses:
        '200':
          description: Demo database reset and seeded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: reset}
  /travelers:
    post:
      operationId: createTraveler
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TravelerCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Traveler'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /travelers/{traveler_id}:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    get:
      operationId: getTraveler
      responses:
        '200':
          description: Traveler
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Traveler'}
        '404': {$ref: '#/components/responses/NotFound'}
  /travelers/{traveler_id}/preferences:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    get:
      operationId: listPreferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Preference'}
    put:
      operationId: replacePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '#/components/schemas/PreferenceInput'}
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Preference'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /travelers/{traveler_id}/agent-policy:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    get:
      operationId: getAgentPolicy
      responses:
        '200':
          description: Server-owned traveler Agent delegation policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPolicy'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: putAgentPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentPolicyPayload'}
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPolicy'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /agent/tools:
    get:
      operationId: listAgentTools
      responses:
        '200':
          description: Safe CityNexus Agent tool catalog
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentToolDescriptor'}
  /agent/tools/v2:
    get:
      operationId: listAgentToolsV2
      responses:
        '200':
          description: Expanded typed CityNexus Agent tool catalog
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentToolDescriptor'}
  /agent/runtime-status:
    get:
      operationId: getAgentRuntimeStatus
      responses:
        '200':
          description: Non-secret agent runtime identity and MCP proof status
          content:
            application/json:
              schema:
                type: object
                required:
                  - runtime_identity
                  - native_binary_detected
                  - native_mcp_proven
                  - mcp_server
                  - deepseek_configured
                  - hermes_compat_configured
                properties:
                  runtime_identity: {type: string}
                  native_binary_detected: {type: boolean}
                  native_mcp_proven: {type: boolean}
                  mcp_server: {type: string}
                  deepseek_configured: {type: boolean}
                  hermes_compat_configured: {type: boolean}
                  hermes_native_gateway: {type: object}
  /agent/hermes/capabilities:
    get:
      operationId: getNativeHermesCapabilities
      responses:
        '200':
          description: Non-secret official Hermes Runs API capability status
          content:
            application/json:
              schema: {type: object}
  /agent/hermes/runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getNativeHermesRun
      responses:
        '200':
          description: Native Hermes run status
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}
  /agent/hermes/runs/{run_id}/events:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: streamNativeHermesRunEvents
      responses:
        '200':
          description: Native Hermes run progress as server-sent events
          content:
            text/event-stream:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
  /agent/tools/{tool_name}:
    parameters:
      - name: tool_name
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: callAgentTool
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentToolCall'}
      responses:
        '200':
          description: Structured server-owned Agent tool receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /agent/tools/v2/{tool_name}:
    parameters:
      - name: tool_name
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: callAgentToolV2
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentToolCall'}
      responses:
        '200':
          description: Structured typed Agent action receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys:
    post:
      operationId: createJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourney
      responses:
        '200':
          description: Journey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyPatch'}
      responses:
        '200':
          description: Updated journey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/constraints:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listConstraints
      responses:
        '200':
          description: Constraints
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Constraint'}
    post:
      operationId: addConstraint
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConstraintInput'}
      responses:
        '201':
          description: Constraint created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Constraint'}
  /journeys/{journey_id}/constraints/{constraint_id}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: constraint_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: deleteConstraint
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
  /places:
    get:
      operationId: searchPlaces
      parameters:
        - name: city_code
          in: query
          required: true
          schema: {type: string}
        - name: category
          in: query
          schema: {type: string}
        - name: q
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Place catalog
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Place'}
  /city-services:
    get:
      operationId: searchCityServices
      parameters:
        - name: city_code
          in: query
          required: true
          schema: {type: string}
        - name: service_type
          in: query
          schema: {type: string}
      responses:
        '200':
          description: City services
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CityService'}
  /city-services/{service_id}/booking-slots:
    parameters:
      - name: service_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getBookingSlots
      parameters:
        - name: start_at
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end_at
          in: query
          required: true
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Normalised provider booking slots with provenance
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BookingSlot'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/plans/generate:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: generatePlans
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                planning_mode: {$ref: '#/components/schemas/PlanningMode'}
                candidate_count: {type: integer, minimum: 1, maximum: 5, default: 3}
                place_ids:
                  type: array
                  minItems: 2
                  maxItems: 12
                  items: {type: string}
                  description: Explicit selected/discovered POIs for the generic Compose Engine path.
      responses:
        '201':
          description: Feasible candidate plans
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanVersion'}
        '422': {$ref: '#/components/responses/Infeasible'}
  /journeys/{journey_id}/plans:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listPlans
      responses:
        '200':
          description: Journey plan versions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanVersion'}
  /plans/{plan_version_id}:
    parameters:
      - {$ref: '#/components/parameters/PlanVersionId'}
    get:
      operationId: getPlan
      responses:
        '200':
          description: Plan with activities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/plans/{plan_version_id}/select:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/PlanVersionId'}
    post:
      operationId: selectPlan
      responses:
        '200':
          description: Selected plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Infeasible'}
  /journeys/{journey_id}/bookings:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookingCreate'}
      responses:
        '201':
          description: Simulated booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
  /bookings/{booking_id}/cancel:
    post:
      operationId: cancelBooking
      parameters:
        - name: booking_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Cancelled booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{booking_id}:
    parameters:
      - name: booking_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getBooking
      responses:
        '200':
          description: Current provider-normalised booking state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/orders:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreate'}
      responses:
        '201':
          description: Simulated order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
  /journeys/{journey_id}/transactions:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransactionCreate'}
      responses:
        '201':
          description: Simulated transaction
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '409': {$ref: '#/components/responses/Conflict'}
  /transactions/{transaction_id}:
    parameters:
      - name: transaction_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getTransaction
      responses:
        '200':
          description: Current provider-normalised payment state and traceable reference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '404': {$ref: '#/components/responses/NotFound'}
  /commitments/{commitment_id}:
    parameters:
      - name: commitment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getCommitment
      responses:
        '200':
          description: Commitment state and deterministic policy evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Commitment'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/start:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: startJourney
      responses:
        '200':
          description: Journey started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyTwin'}
        '409': {$ref: '#/components/responses/Conflict'}
  /journeys/{journey_id}/activities/{activity_id}/complete:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: activity_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: completeActivity
      responses:
        '200':
          description: Updated JourneyTwin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyTwin'}
        '409': {$ref: '#/components/responses/Conflict'}
  /journeys/{journey_id}/twin:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourneyTwin
      parameters:
        - name: now
          in: query
          required: false
          description: Deterministic demo/test projection time; production clients normally omit it.
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: JourneyTwin projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyTwin'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/weather/refresh:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: refreshJourneyWeather
      description: Server-owned Open-Meteo refresh with deterministic Activity attribution.
      responses:
        '200':
          description: Weather refresh evidence and created or reused Event identities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeatherRuntimeRefresh'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/history:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourneyHistory
      responses:
        '200':
          description: Timeline of audit-worthy journey events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/HistoryItem'}
  /journeys/{journey_id}/agent-feed:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getAgentFeed
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Persisted audit projection for Agent actions and decisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentFeedResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/agent/commands:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: runAgentCommand
      description: Compile a natural-language one-run Journey Mission and execute it through the server-owned Agent Gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCommandRequest'}
      responses:
        '200':
          description: Persisted Mission and AgentRun result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCommandResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/guardian/mission:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    put:
      operationId: putGuardianMission
      description: Compile and activate the persisted standing Mission used by proactive scans.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCommandRequest'}
      responses:
        '200':
          description: Active standing MissionIntent with server-resolved authority envelope
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/guardian/scan:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: scanJourneyGuardian
      description: Scan persisted Journey signals and launch at most one policy-bounded recovery per incident state.
      responses:
        '200':
          description: Persisted Guardian decision and optional recovery trace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuardianRun'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/guardian/status:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourneyGuardianStatus
      responses:
        '200':
          description: Reloadable standing Mission and Guardian run history
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/agent/approvals/{approval_id}/approve:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: approval_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: approveAgentAction
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentApprovalRequest'}
      responses:
        '200':
          description: User-bound approval receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentApprovalResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/agent/runs/{run_id}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAgentRun
      description: Reload a persisted AgentRun and its server-recorded tool trace.
      responses:
        '200':
          description: Persisted AgentRun with ordered tool steps
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/route-evidence:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getRouteEvidence
      parameters:
        - name: proposal_id
          in: query
          required: false
          schema: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: Frozen provider route evidence and old/new map features
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteEvidence'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /journeys/{journey_id}/reflect:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourneyReflect
      responses:
        '200':
          description: Backend-derived Journey history and reflection summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReflectSummary'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/events:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listEvents
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Event'}
    post:
      operationId: injectOrRecordEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventCreate'}
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
  /journeys/{journey_id}/events/{event_id}/impact:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/EventId'}
    get:
      operationId: getEventImpact
      responses:
        '200':
          description: Persisted hybrid impact assessment and validation provenance
          content:
            application/json:
              schema:
                type: object
                required: [id, event_id, journey_id, status, candidates, validated_activity_ids]
                properties:
                  id: {type: string, format: uuid}
                  event_id: {type: string, format: uuid}
                  journey_id: {type: string, format: uuid}
                  provider_key: {type: string}
                  model_key: {type: string}
                  status: {type: string}
                  uncertain: {type: boolean}
                  selected_activity_id: {type: [string, 'null'], format: uuid}
                  candidates: {type: array, items: {type: object}}
                  validated_activity_ids: {type: array, items: {type: string, format: uuid}}
                  rejected_activity_ids: {type: array, items: {type: string}}
                  reason_codes: {type: array, items: {type: string}}
                  semantic_reason: {type: string}
                  failure_code: {type: [string, 'null']}
