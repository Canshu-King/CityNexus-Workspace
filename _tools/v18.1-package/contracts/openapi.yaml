components:
  parameters:
    TravelerId:
      name: traveler_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    JourneyId:
      name: journey_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ActivityId:
      name: activity_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    EventId:
      name: event_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanVersionId:
      name: plan_version_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Input validation error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Infeasible:
      description: No feasible result under hard constraints
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    PlanningMode:
      type: string
      enum: [balanced, budget, explore, strict_schedule]
    HealthResponse:
      type: object
      required: [status, database, ai]
      properties:
        status: {type: string, enum: [ok, degraded]}
        database: {type: string, enum: [ok, error]}
        ai: {type: string, enum: [available, unavailable, disabled]}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            trace_id: {type: string}
    TravelerCreate:
      type: object
      required: [display_name, timezone]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 120}
        email: {type: [string, 'null'], format: email}
        locale: {type: string, default: en-GB}
        timezone: {type: string}
    Traveler:
      allOf:
        - {$ref: '#/components/schemas/TravelerCreate'}
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    PreferenceInput:
      type: object
      required: [category, key, value, weight]
      properties:
        category: {type: string}
        key: {type: string}
        value: {}
        weight: {type: number, minimum: 0, maximum: 1}
    Preference:
      allOf:
        - {$ref: '#/components/schemas/PreferenceInput'}
        - type: object
          required: [id, traveler_id]
          properties:
